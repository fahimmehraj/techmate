name: Railway infrastructure

on:
  pull_request:
    paths:
      - ".railway/**"
      - ".github/workflows/railway-infrastructure.yml"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
  push:
    branches: [main]
    paths:
      - ".railway/**"
      - ".github/workflows/railway-infrastructure.yml"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Railway IaC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  apply:
    name: Apply production infrastructure
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: railway-production
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Target production
        run: railway link --project technyu-coordinator --environment production
      - name: Preview infrastructure changes
        run: railway config plan
      - name: Apply non-destructive infrastructure changes
        run: railway config apply --yes
